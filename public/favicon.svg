<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="12 8" opacity="0.4" />
  
  <!-- Rice Grain / Sheaf Motif -->
  <g transform="translate(256, 256) scale(1.4)">
    <!-- Central Stalk -->
    <path d="M0,80 Q-5,0 0,-70" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Rice Grains Right -->
    <path d="M2,-40 C30,-55 45,-35 2,-20 Z" fill="url(#goldGrad)" />
    <path d="M2,-10 C35,-25 50,-5 2,10 Z" fill="url(#goldGrad)" />
    <path d="M2,20 C32,5 45,25 2,40 Z" fill="url(#goldGrad)" />
    
    <!-- Rice Grains Left -->
    <path d="M-2,-50 C-35,-65 -50,-45 -2,-30 Z" fill="url(#goldGrad)" />
    <path d="M-2,-20 C-40,-35 -55,-15 -2,0 Z" fill="url(#goldGrad)" />
    <path d="M-2,10 C-38,-5 -50,15 -2,30 Z" fill="url(#goldGrad)" />
  </g>
</svg>
